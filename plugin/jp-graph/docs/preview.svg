<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="system-ui, 'Segoe UI', sans-serif">
  <rect width="960" height="520" rx="12" fill="#0f1520"/>
  <rect x="0.5" y="0.5" width="959" height="519" rx="11.5" fill="none" stroke="#25303f"/>
  <rect x="1" y="1" width="958" height="54" rx="11" fill="#131b27"/>
  <circle cx="26" cy="28" r="9" fill="none" stroke="#4C8DFF" stroke-width="1.6"/>
  <circle cx="26" cy="19" r="2.4" fill="#22C55E"/>
  <text x="44" y="25" fill="#e6edf7" font-size="14" font-weight="600">日語學習</text>
  <text x="44" y="41" fill="#8a97a8" font-size="10.5">本地語法、單詞、例句資料庫的關係圖</text>
  <rect x="210" y="14" width="330" height="28" rx="8" fill="#0f1520" stroke="#2b3646"/>
  <text x="224" y="32" fill="#6f7c8d" font-size="11">搜尋單詞、語法或例句…</text>
  <text x="812" y="32" fill="#8a97a8" font-size="10.5">14,392 條語法 · 307,889 個單詞</text>
  <rect x="1" y="55" width="1" height="464" fill="#1b2431"/>
  <line x1="1" y1="55" x2="959" y2="55" stroke="#1b2431"/>

  <text x="18" y="82" fill="#8a97a8" font-size="10" letter-spacing="1.2">分類</text>
  <text x="18" y="100" fill="#6f7c8d" font-size="9.5">功能 · 語域 · 難度 · 類型</text>
  <g font-size="9.5">
    <rect x="18" y="112" width="74" height="19" rx="9.5" fill="none" stroke="#2b3646"/><text x="28" y="125" fill="#c8d3e2">原因・理由</text><text x="78" y="125" fill="#6f7c8d">35</text>
    <rect x="98" y="112" width="74" height="19" rx="9.5" fill="none" stroke="#2b3646"/><text x="108" y="125" fill="#c8d3e2">逆接・讓歩</text><text x="162" y="125" fill="#6f7c8d">31</text>
    <rect x="18" y="137" width="66" height="19" rx="9.5" fill="none" stroke="#2b3646"/><text x="28" y="150" fill="#c8d3e2">強調</text><text x="58" y="150" fill="#6f7c8d">52</text>
    <rect x="90" y="137" width="60" height="19" rx="9.5" fill="none" stroke="#2b3646"/><text x="100" y="150" fill="#c8d3e2">否定</text>
    <rect x="18" y="162" width="60" height="19" rx="9.5" fill="none" stroke="#2b3646"/><text x="28" y="175" fill="#c8d3e2">時間</text>
    <rect x="84" y="162" width="74" height="19" rx="9.5" fill="none" stroke="#2b3646"/><text x="94" y="175" fill="#c8d3e2">推量・推測</text>
  </g>

  <g stroke-width="1.2" opacity=".55">
    <line x1="400" y1="210" x2="470" y2="168" stroke="#b07cff"/>
    <line x1="400" y1="210" x2="330" y2="170" stroke="#e0a54a"/>
    <line x1="400" y1="210" x2="300" y2="268" stroke="#4a9ce0"/>
    <line x1="400" y1="210" x2="470" y2="286" stroke="#5bb98c"/>
    <line x1="470" y1="168" x2="546" y2="196" stroke="#e0a54a"/>
    <line x1="470" y1="168" x2="540" y2="130" stroke="#5bb98c"/>
    <line x1="300" y1="268" x2="246" y2="322" stroke="#4a9ce0"/>
    <line x1="470" y1="286" x2="540" y2="330" stroke="#5bb98c"/>
  </g>
  <g>
    <circle cx="400" cy="210" r="27" fill="none" stroke="#4ac9c0" stroke-width="1.4" opacity=".5"/>
    <rect x="336" y="196" width="128" height="26" rx="7" fill="#16202d" stroke="#7c9cff" stroke-width="1.8"/>
    <text x="400" y="213" fill="#e6edf7" font-size="11" text-anchor="middle">Clause + が / けど</text>
    <circle cx="470" cy="168" r="8" fill="#0f1520" stroke="#e0a54a" stroke-width="1.5"/>
    <text x="470" y="188" fill="#c8d3e2" font-size="10" text-anchor="middle">〜けど / けれども</text>
    <circle cx="546" cy="196" r="5" fill="#5ec9a5"/>
    <text x="556" y="200" fill="#8a97a8" font-size="9.5">けれども</text>
    <circle cx="330" cy="170" r="5" fill="#5ec9a5"/>
    <text x="292" y="160" fill="#8a97a8" font-size="9.5">けど</text>
    <rect x="212" y="318" width="150" height="20" rx="5" fill="#0f1520" stroke="#e0a54a" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="287" y="332" fill="#c8d3e2" font-size="9.5" text-anchor="middle">この本は難しいですが</text>
    <circle cx="470" cy="286" r="6" fill="#0f1520" stroke="#5ec9a5" stroke-width="1.5"/>
    <text x="470" y="306" fill="#8a97a8" font-size="9.5">時間</text>
    <rect x="470" y="120" width="140" height="20" rx="5" fill="#0f1520" stroke="#a98be0" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="540" y="134" fill="#c8d3e2" font-size="9.5" text-anchor="middle">行きたいけど、時間がない</text>
    <rect x="468" y="318" width="140" height="20" rx="5" fill="#0f1520" stroke="#a98be0" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="538" y="332" fill="#c8d3e2" font-size="9.5" text-anchor="middle">高かったけど、買ってよかった</text>
  </g>

  <rect x="676" y="56" width="283" height="463" fill="#111925"/>
  <text x="694" y="82" fill="#8a97a8" font-size="10" letter-spacing="1.2">節點資料</text>
  <text x="694" y="110" fill="#e6edf7" font-size="14" font-weight="600">Clause + が / けど / けれども</text>
  <text x="694" y="128" fill="#8a97a8" font-size="10.5">N4 · but / although / however</text>
  <rect x="694" y="142" width="46" height="18" rx="9" fill="none" stroke="#2b3646"/>
  <text x="703" y="155" fill="#c8d3e2" font-size="9.5">N4</text>
  <rect x="746" y="142" width="42" height="18" rx="9" fill="none" stroke="#2b3646"/>
  <text x="755" y="155" fill="#c8d3e2" font-size="9.5">中性</text>
  <rect x="694" y="172" width="250" height="96" rx="9" fill="#0d1420" stroke="#25303f"/>
  <text x="706" y="190" fill="#8a97a8" font-size="9.5">語感・用法</text>
  <text x="706" y="208" fill="#c8d3e2" font-size="9.5">が、けど、けれども是表示「但是」或</text>
  <text x="706" y="222" fill="#c8d3e2" font-size="9.5">「雖然」的接續詞，連接具有對比關係</text>
  <text x="706" y="236" fill="#c8d3e2" font-size="9.5">的兩個分句。が 稍正式且多用於書面；</text>
  <text x="706" y="250" fill="#c8d3e2" font-size="9.5">けど 為口語……</text>
  <rect x="694" y="282" width="250" height="120" rx="9" fill="#0d1420" stroke="#25303f"/>
  <text x="706" y="300" fill="#c8d3e2" font-size="10.5" font-weight="600">關聯</text>
  <text x="706" y="320" fill="#8a97a8" font-size="9.5">同檢索鍵（近義・對照）</text>
  <circle cx="712" cy="339" r="3" fill="#7c9cff"/><text x="721" y="342" fill="#c8d3e2" font-size="9.5">〜けど / 〜けれども</text>
  <circle cx="712" cy="356" r="3" fill="#7c9cff"/><text x="721" y="359" fill="#c8d3e2" font-size="9.5">けれど（も）</text>
  <text x="706" y="378" fill="#8a97a8" font-size="9.5">例句</text>
  <circle cx="712" cy="392" r="3" fill="#a98be0"/><text x="721" y="395" fill="#c8d3e2" font-size="9.5">この本は難しいですが、面白いです。</text>
  <g font-size="9.5">
    <circle cx="706" cy="430" r="3" fill="#7c9cff"/><text x="714" y="433" fill="#6f7c8d">語法</text>
    <circle cx="756" cy="430" r="3" fill="#5ec9a5"/><text x="764" y="433" fill="#6f7c8d">單詞</text>
    <circle cx="806" cy="430" r="3" fill="#e0a54a"/><text x="814" y="433" fill="#6f7c8d">例句</text>
  </g>
</svg>
